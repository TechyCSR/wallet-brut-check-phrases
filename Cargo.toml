[package]
name = "fast-bip39-gen"
version = "1.0.0"
edition = "2021"

[dependencies]
bip39 = "2.0"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
sha2 = { version = "0.10", features = ["asm"] }
clap = { version = "4.5", features = ["derive"] }
bitcoin = "0.32.102"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
bs58 = "0.5.1"
ed25519-dalek = "3.0.0"
hmac = "0.12"
csv = "1.4.0"
ureq = { version = "3.5.1", features = ["json"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
